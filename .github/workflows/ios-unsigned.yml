name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned archive
        run: |
          set -euo pipefail
          PROJECT=$(ls -d ios/*.xcodeproj | head -n 1)
          APP_NAME=$(basename "$PROJECT" .xcodeproj)
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME="$APP_NAME"
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" -list
          if ! xcodebuild -workspace "$WORKSPACE" -list -json | jq -e --arg s "$SCHEME" '.workspace.schemes | index($s)' > /dev/null; then
            echo "::error::Scheme '$SCHEME' not found in $WORKSPACE"
            exit 1
          fi
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SKIP_INSTALL=NO

      - name: Package IPA
        run: |
          set -euo pipefail
          APPS_DIR="$RUNNER_TEMP/App.xcarchive/Products/Applications"
          ls -la "$APPS_DIR" || { echo "::error::No Applications dir in archive"; exit 1; }
          APP=$(find "$APPS_DIR" -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP" || { echo "::error::No .app found in archive"; exit 1; }
          echo "App: $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          rm -rf out/Payload/*.app/_CodeSignature || true
          rm -f out/Payload/*.app/embedded.mobileprovision || true
          cd out
          zip -qry app-unsigned.ipa Payload
          ls -lh app-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ipa
          path: out/app-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
